name: Generate lightbox metadata (temporary)
on:
  push:
    branches: [feature/image-led-lightbox-v0.5.0]
    paths: ['.github/workflows/generate-lightbox-metadata.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/image-led-lightbox-v0.5.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:licenses && pnpm gen:notices
      - name: Commit generated third-party notices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/led-lightbox/LICENSE.md apps/led-lightbox/public/THIRD-PARTY-NOTICES.txt
          git diff --cached --quiet || git commit -m "Generate LED lightbox licence and third-party notices"
          git push origin HEAD:feature/image-led-lightbox-v0.5.0
