name: Publish private Windows v0.4.0 release

on:
  workflow_run:
    workflows: ['Windows desktop build']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Verify private repository and validated Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo" --jq '.private')" = true
          test "$(gh api "repos/$repo" --jq '.fork')" = false

          run_id="$TRIGGER_RUN"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --repo "$repo" --workflow "Windows desktop build" --branch master --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id"
          test "$(gh api "repos/$repo/actions/runs/$run_id" --jq '.conclusion')" = success
          test "$(gh api "repos/$repo/actions/runs/$run_id" --jq '.event')" = push
          test "$(gh api "repos/$repo/actions/runs/$run_id" --jq '.head_branch')" = master
          build_sha="$(gh api "repos/$repo/actions/runs/$run_id" --jq '.head_sha')"
          test -n "$build_sha"
          version="$(gh api "repos/$repo/contents/src-tauri/tauri.conf.json?ref=$build_sha" --jq '.content' | base64 -d | jq -r '.version')"
          test "$version" = 0.4.0
          echo "WINDOWS_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "WINDOWS_COMMIT=$build_sha" >> "$GITHUB_ENV"

      - name: Download verified Windows installer and executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$WINDOWS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name vostoklabs-standalone-windows-x64 --dir release-assets

      - name: Publish private Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer="$(find release-assets -type f -iname '*-setup.exe' -print -quit)"
          executable="$(find release-assets -type f -name 'vostoklabs-standalone.exe' -print -quit)"
          test -n "$installer" && test -s "$installer"
          test -n "$executable" && test -s "$executable"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.4.0 already exists. No changes made.'
            exit 0
          fi
          cat > notes.md <<'NOTES'
          ## Vostok Labs Standalone v0.4.0 — simplified Windows edition

          Removed both post-export licence interruptions from the Tauri desktop build: the centre-screen **Download started** licence modal and the top-right **Download started** licence reminder. Exports and native Save As still work as before. The normal website retains its licence disclosures and download prompts.

          The bundled generator apps and product listings remain intact; the public website was not changed.

          ### Downloads
          - Windows x64 installer (recommended)
          - Application executable (requires Microsoft WebView2)

          ### Notes
          Unsigned builds may cause a Windows SmartScreen prompt.
          Original Vostok Labs license and attribution are retained. Private, personal and noncommercial use only; this modified desktop edition is not intended for public redistribution.
          NOTES
          gh release create v0.4.0 "$installer" "$executable" \
            --repo "$GITHUB_REPOSITORY" --target "$WINDOWS_COMMIT" \
            --title 'Vostok Labs Standalone v0.4.0 — Windows' --notes-file notes.md
