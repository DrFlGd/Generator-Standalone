name: Publish private Windows v0.1.0 release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-windows-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for tested Windows desktop build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 37851626108 --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify private repository and successful desktop build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.fork')" = false
          run_id=37851626108
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')" = 028772f51d3990fd276b6367b6d1c530615a67e5

      - name: Download validated Windows installer and executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 37851626108 --repo "$GITHUB_REPOSITORY" --name vostoklabs-standalone-windows-x64 --dir release-assets

      - name: Publish version 0.1.0 privately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer="$(find release-assets -type f -iname '*-setup.exe' -print -quit)"
          executable="$(find release-assets -type f -name 'vostoklabs-standalone.exe' -print -quit)"
          test -n "$installer" && test -s "$installer"
          test -n "$executable" && test -s "$executable"

          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 already exists; refusing to replace an existing release."
            exit 0
          fi

          cat > release-notes.md <<'NOTES'
          ## Vostok Labs Standalone v0.1.0 — Windows

          Private, personal-use Windows desktop edition of Vostok Labs' hub and ten local web generators.

          ### Included
          - Windows x64 NSIS installer (recommended)
          - Windows x64 application executable (requires WebView2)
          - Offline-packaged hub pages, images, fonts, models, and bundled generator apps
          - Existing 3D model exporters, geometry workers, and 3D previews
          - Native Windows Save As dialogs for HTML download exports
          - External links opened in the default web browser

          ### Installation
          Download and run the setup executable on Windows. This release is unsigned, so Windows SmartScreen may display a warning.

          ### Licensing
          Original Vostok Labs attribution and upstream CC BY-NC-ND 4.0 terms are retained. This modified desktop edition is maintained in a private repository for personal, noncommercial use, not for public redistribution.
          NOTES

          gh release create v0.1.0 "$installer" "$executable" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Vostok Labs Standalone v0.1.0 — Windows" \
            --notes-file release-notes.md
