[package]
name = "vostoklabs-standalone"
version = "0.5.0"
description = "Windows desktop edition of Vostok Labs tools"
authors = ["Vostok Labs contributors"]
edition = "2021"

[lib]
name = "vostoklabs_standalone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
